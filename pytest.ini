[pytest]
testpaths = tests
markers =
    store: exercises code that lives on the store branch, not in this tree.

# ``-n auto`` because the suite's cost is not the tests, it is what they start.
# Collection is 0.6s of a 74s serial run; the rest is real ``python -m
# guest.child`` boxes (anything written to a bare ``tmp_path`` fails closed to
# SUBPROCESS in ``isolation.required_isolation``) and the deliberate wall-clock
# waits that watchdog, starvation and deadline tests exist to measure. None of
# that gets cheaper by being clever — it gets cheaper by not being serial.
# Parallel: 16s.
#
# ``--dist loadfile`` rather than the default per-test ``load``: eight files
# hold ``scope="module"`` fixtures and several stand up a real server, so
# per-test distribution would build them once per worker that happened to
# receive one of their tests. Per-file keeps each built exactly once, and keeps
# two workers from racing two instances of the same server. Measured at 16.4s
# against ``load``'s 15.3s — a second, for not having concurrent duplicates of
# a bound port.
#
# Pass ``-n0`` for a serial run when a traceback or ``--pdb`` needs one.
addopts = -m "not store" -n auto --dist loadfile
